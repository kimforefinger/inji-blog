<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Write — Thoughts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">

<!-- Reuses your site's colors/fonts and post styling, so the preview
     below matches the real page. -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="write.css">
</head>
<body>

  <div class="write-page">

    <header class="write-top">
      <a href="index.html" class="link-home">&larr; Site</a>
      <h1>Write a new thought</h1>
      <span></span>
    </header>

    <div class="write-toolbar">
      <button type="button" class="tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button type="button" class="tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" class="tb-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-swatch" data-color="#24261e" title="Ink" style="background:#24261e"></button>
      <button type="button" class="tb-swatch" data-color="#8a4a3a" title="Red"  style="background:#8a4a3a"></button>
      <button type="button" class="tb-swatch" data-color="#3d5a80" title="Blue" style="background:#3d5a80"></button>
      <button type="button" class="tb-swatch" data-color="#4b5d3f" title="Green" style="background:#4b5d3f"></button>
      <button type="button" class="tb-swatch" data-color="#8a7a3a" title="Gold" style="background:#8a7a3a"></button>
    </div>

    <div id="editor" class="write-editor post-rich" contenteditable="true"></div>

    <div class="write-section">
      <span class="write-label">Photos / gifs</span>
      <button type="button" class="btn-add-media" id="btn-add-media">+ add photo or gif</button>
      <input type="file" id="mediaInput" accept="image/*" multiple hidden>
      <div id="media-tray" class="media-tray" hidden></div>
    </div>

    <div class="write-section">
      <label class="write-label" for="yt-input">YouTube link</label>
      <div class="write-inline-add">
        <input type="url" id="yt-input" placeholder="https://youtu.be/...">
        <button type="button" id="btn-add-yt">Add</button>
      </div>
      <ul id="yt-list" class="write-embed-list"></ul>
    </div>

    <div class="write-section">
      <label class="write-label" for="sc-input">SoundCloud link</label>
      <div class="write-inline-add">
        <input type="url" id="sc-input" placeholder="https://soundcloud.com/...">
        <button type="button" id="btn-add-sc">Add</button>
      </div>
      <ul id="sc-list" class="write-embed-list"></ul>
    </div>

    <button type="button" class="btn-generate" id="btn-generate">Generate code</button>
    <p id="write-error" class="write-error" hidden></p>

    <div id="output" class="write-output" hidden>

      <h2>1. Save these into your <code>media</code> folder</h2>
      <div id="output-downloads"></div>

      <h2>2. Paste this into <code>posts.js</code></h2>
      <p class="write-hint">
        Open <code>posts.js</code> and paste this right after the line
        <code>const POSTS = [</code>.
      </p>
      <textarea id="output-code" class="write-code" readonly rows="12"></textarea>
      <button type="button" class="btn-copy" id="btn-copy">Copy code</button>

      <h2>Preview</h2>
      <article class="post-article write-preview" id="preview-article"></article>
    </div>

  </div>

  <script src="write.js"></script>
</body>
</html>
