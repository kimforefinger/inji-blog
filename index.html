<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thoughts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts: swap the family names here AND in the CSS variables at the
     top of style.css if you want to change how the site looks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- Home screen -->
    <section id="view-home" class="view view-home">
      <span class="home-mark">Inji's blog</span>
      <div class="home-inner">
        <p class="home-eyebrow">a quiet place to keep things</p>
        <button class="btn-thoughts" id="btn-open-thoughts" type="button">Thoughts</button>
      </div>
    </section>

    <!-- List of entries -->
    <section id="view-list" class="view view-list" hidden>
      <header class="bar">
        <a href="#home" class="link-home">&larr; Home</a>
        <h1>Thoughts</h1>
        <span></span>
      </header>
      <div id="entries" class="entries"></div>
    </section>

    <!-- A single entry -->
    <section id="view-post" class="view view-post" hidden>
      <header class="bar">
        <a href="#thoughts" class="link-back">&larr; Thoughts</a>
        <span></span>
      </header>
      <article id="post-article" class="post-article"></article>
    </section>

  </div>

  <!-- script.js fetches posts.json (built from your CMS posts + posts.js
       by build-posts.js on every deploy) and renders it. marked.min.js
       turns the CMS's markdown text into HTML. -->
  <script src="marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
